# Nephilex configuration. See docs/configuration.md for all options.

# Scanners to run (empty = all applicable).
scanners: []
exclude_scanners: []

# Extra path globs to ignore (added to built-in ignores).
exclude_paths: []

# Minimum severity to report: info | low | medium | high | critical
min_severity: info

# Fail the process (non-zero exit) if any finding is at/above this severity.
# Useful in CI. Leave empty to never fail on findings.
fail_on: ""

# Security policies (evaluated by ``nephilex policy check``).
policies:
  - id: block-critical
    when:
      severity: critical
    action: block
  - id: block-secrets
    when:
      scanner: secrets
    action: block

# Flagship educational feature: safe, sandboxed attack demonstrations.
attack_simulation: false

# Generate (and where possible verify) fix patches.
generate_patches: false

ai:
  # heuristic (offline, no key) | anthropic | openai | ollama (local)
  provider: heuristic
  model: ""
  enabled: true
  temperature: 0.0
  max_tokens: 4096

# Per-scanner options.
scanner_options:
  secrets:
    entropy: true
    entropy_threshold: 4.0
