# Nephilex hooks for the pre-commit framework (https://pre-commit.com).
#
# Usage, add to your project's .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/nephilex/nephilex
#       rev: v0.9.2
#       hooks:
#         - id: nephilex-secrets          # fast: secrets only, ideal for every commit
#         # - id: nephilex                # fuller static scan; heavier, better in CI
#
# Both hooks scan the repository (not just staged files) so cross-file context,
# lockfiles, configs, imports, stays available. The secrets hook is the one
# meant to run on every commit: catching a credential *before* it enters git
# history is the highest-value moment for secrets detection.
- id: nephilex-secrets
  name: nephilex (secrets)
  description: Block commits that introduce hardcoded secrets or credentials.
  entry: nephilex scan . --scanners secrets --fail-on high --no-ai --quiet
  language: python
  pass_filenames: false

- id: nephilex
  name: nephilex (full static scan)
  description: >-
    Full Nephilex static scan: secrets, dependency vulnerabilities (OSV), SAST
    patterns, taint analysis, and IaC checks. Heavier than nephilex-secrets;
    consider `stages: [pre-push]` or CI instead of every commit.
  entry: nephilex scan . --fail-on high --no-ai --quiet
  language: python
  pass_filenames: false
