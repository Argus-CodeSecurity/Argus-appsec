[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "argus-appsec"
dynamic = ["version"]
description = "An open-source AI Security Engineer: maps your application, finds vulnerabilities, explains them, and proposes verified fixes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Haseeb Farooq", email = "haseebfarooq35@gmail.com" }]
keywords = [
  "security",
  "appsec",
  "sast",
  "vulnerability-scanner",
  "penetration-testing",
  "ai",
  "llm",
  "llm-security",
  "prompt-injection",
  "secrets-detection",
  "sbom",
  "supply-chain-security",
  "devsecops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Cloud AI providers
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.40"]
# AST-based data-flow scanning (tree-sitter). Optional: without it, Argus uses the
# regex + lightweight-taint code scanner and skips the deeper AST tier gracefully.
ast = [
  "tree-sitter>=0.21",
  "tree-sitter-python>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
]
# The optional web dashboard (scan history + trends).
dashboard = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlmodel>=0.0.14",
  "python-multipart>=0.0.9",
]
# Build the documentation site (MkDocs Material).
docs = [
  "mkdocs-material>=9.5",
]
# Everything for local development and tests
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "httpx>=0.27",
  "tree-sitter>=0.21",
  "tree-sitter-python>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlmodel>=0.0.14",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/Argus-CodeSecurity/Argus-appsec"
Documentation = "https://argus-codesecurity.github.io/Argus-appsec/"
Repository = "https://github.com/Argus-CodeSecurity/Argus-appsec"
Issues = "https://github.com/Argus-CodeSecurity/Argus-appsec/issues"
Changelog = "https://github.com/Argus-CodeSecurity/Argus-appsec/blob/main/CHANGELOG.md"
Security = "https://github.com/Argus-CodeSecurity/Argus-appsec/security/policy"

[project.scripts]
argus = "argus.cli.main:app"

# Plugins are discovered through this entry-point group. Third-party packages
# register scanners, reporters, and AI providers here without touching the core.
[project.entry-points."argus.plugins"]
builtin = "argus.plugins:register_builtins"

# Single source of truth for the version: argus.__version__.
[tool.hatch.version]
path = "src/argus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.hatch.build.targets.sdist]
include = [
  "src/argus",
  "tests",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "osv_network: exercises the OSV client with a mocked transport (never the real network)",
  "exploit_network: exercises the EPSS/KEV client with a mocked transport (never the real network)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# The example app contains deliberately insecure, non-idiomatic code so the
# scanners have something to find. Linting it is meaningless, exclude it.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's API intentionally uses function calls (Option/Argument) as parameter
# defaults; B008 flags that pattern but it is correct and idiomatic here.
"src/argus/cli/*" = ["B008"]
# FastAPI's Depends() in parameter defaults is the framework's idiom, like Typer's.
"src/argus/dashboard/*" = ["B008"]
"tests/corpus/*" = ["F821"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["argus"]

[tool.coverage.run]
branch = true
source = ["argus"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '@(abc\.)?abstractmethod',
]
