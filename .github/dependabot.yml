# Keep dependencies and Action pins current. A security scanner with stale or
# unpinned dependencies is one typosquat away from being the supply-chain attack
# it warns about, so updates are automated and reviewed.
#
# The cooldown holds back brand-new releases for a few days, which is when most
# compromised package versions are caught and yanked.
#
# Routine updates are monthly and grouped, to match the release rhythm (one
# feature release about every four weeks, see RELEASING.md). Security updates
# for known vulnerabilities are separate and are not held to this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 5

  # examples/vulnerable-app is deliberately vulnerable: it is the target the
  # scanners and docs demonstrate against. Never upgrade its dependencies.
  - package-ecosystem: pip
    directory: "/examples/vulnerable-app"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
