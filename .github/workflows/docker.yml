# Build and publish the official Nephilex container image to GitHub Container
# Registry. Runs on every release (tagged with the version and `latest`) and can
# be triggered manually for a one-off build. Every pushed image carries a signed
# build-provenance attestation and an SBOM, verifiable with:
#
#   gh attestation verify oci://ghcr.io/nephilex/nephilex:<version> \
#     --owner nephilex
#
# Usage once published:
#   docker run --rm -v "$PWD:/work" ghcr.io/nephilex/nephilex scan /work
name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is tagged from the release tag, so a tag created on the
      # wrong commit would publish mislabeled images. Same check as publish.yml.
      - name: Release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/nephilex/__init__.py)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$version'."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nephilex
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/nephilex
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
