# Publish Argus to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC), no API token or secret is stored in the
# repo. You configure the trust relationship once on PyPI (see RELEASING.md).
#
# For a security tool, release integrity is part of the product: every release
# ships a CycloneDX SBOM and a signed build-provenance attestation, so consumers
# can verify what is in the artifact and that it was built by this pipeline.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build, SBOM & provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation (OIDC)
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Generate CycloneDX SBOM (resolved runtime dependencies)
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --upgrade pip
          /tmp/sbomenv/bin/pip install .
          /tmp/sbomenv/bin/pip install cyclonedx-bom
          mkdir -p sbom
          /tmp/sbomenv/bin/cyclonedx-py environment -o sbom/argus-appsec.cdx.json

      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: "dist/*"

      - name: Upload distributions
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom
          path: sbom/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/argus-appsec/
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.12.3

  attach-sbom:
    name: Attach SBOM to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM as a release asset
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sbom
          path: sbom/
      - name: Upload SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            sbom/argus-appsec.cdx.json \
            --repo "${{ github.repository }}" \
            --clobber
