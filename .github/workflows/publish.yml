# Publish Argus to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC), no API token or secret is stored in the
# repo. You configure the trust relationship once on PyPI (see RELEASING.md).
#
# For a security tool, release integrity is part of the product: every release
# ships a CycloneDX SBOM plus signed build-provenance and SBOM attestations, so
# consumers can verify what is in the artifact and that this pipeline built it.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,ast]"

      - name: Release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import argus; print(argus.__version__)')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$version'."
            exit 1
          fi

      - name: Test
        run: pytest -q

  build:
    name: Build, SBOM & provenance
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation (OIDC)
      attestations: write # record the attestation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m twine check --strict dist/*

      - name: Generate CycloneDX SBOM (resolved runtime dependencies)
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install --require-hashes -r requirements.lock
          /tmp/sbomenv/bin/pip install --no-deps dist/*.whl
          python -m pip install "cyclonedx-bom==7.5.0"
          mkdir -p sbom
          cyclonedx-py environment /tmp/sbomenv -o sbom/argus-appsec.cdx.json

      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: "dist/*"

      - name: Attest the SBOM for the distributions
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: "dist/*"
          sbom-path: sbom/argus-appsec.cdx.json

      - name: Upload distributions
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom
          path: sbom/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/argus-appsec/
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.12.3

  attach-sbom:
    name: Attach SBOM to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the SBOM as a release asset
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sbom
          path: sbom/
      - name: Upload SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" sbom/argus-appsec.cdx.json --repo "$REPO" --clobber
