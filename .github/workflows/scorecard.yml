# OpenSSF Scorecard: an automated audit of this project's supply-chain security
# posture (branch protection, pinned dependencies, token permissions, signing,
# and more). Results are published so the score and badge can be shown in the
# README, and uploaded to Code Scanning so regressions surface as alerts.
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: "27 2 * * 1" # weekly, Monday 02:27 UTC
  push:
    branches: [main]

# Least privilege at the top; the analysis job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to Code Scanning
      id-token: write # publish results to the public Scorecard API
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841 # v3.28.13
        with:
          sarif_file: results.sarif
