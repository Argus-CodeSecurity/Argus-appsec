# Nephilex server agent example
# Copy to .nephilex/agent.yml and customize paths for your host.

interval: 600
state_dir: .nephilex/agent
push: false
# cloud_url: ${NEPHILEX_CLOUD_URL}
# cloud_token: ${NEPHILEX_CLOUD_TOKEN}
fail_on_drift: high
host_label: my-server

targets:
  - path: .
    scanners: secrets, patterns, sca, iac, cicd, container, cloud
  - path: /etc
    scanners: patterns
