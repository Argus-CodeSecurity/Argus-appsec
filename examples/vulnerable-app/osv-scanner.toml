# OSV-Scanner configuration for the deliberately vulnerable demo app.
#
# requirements.txt here pins old flask, requests and pyyaml on purpose: the
# dependency scanner and the docs demonstrate against them, and Dependabot is
# told never to upgrade them (.github/dependabot.yml). This app is never
# installed or shipped; Nephilex's own dependencies are in requirements.lock and
# requirements/, which this file does not cover.
#
# Each advisory is listed under its PYSEC and GHSA ids.

